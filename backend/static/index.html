<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HealML</title><style>body{font:16px system-ui;background:#08111f;color:#e7edf7;max-width:1100px;margin:auto;padding:28px}button{background:#18b68b;color:#04110e;border:0;padding:11px 16px;border-radius:7px;font-weight:700;margin:4px}select{padding:10px}section{background:#101d30;border:1px solid #203651;border-radius:12px;padding:18px;margin:14px 0}.cards{display:flex;gap:12px;flex-wrap:wrap}.card{background:#14253d;padding:14px;border-radius:9px;min-width:160px}pre{white-space:pre-wrap;background:#07101b;padding:14px;border-radius:8px;overflow:auto}.good{color:#39d49b}.warn{color:#ffc857}</style></head><body><h1>HealML <small>— ML Models That Monitor, Recover, and Evolve</small></h1><section><h2>Control center</h2><select id="algo"><option value="random_forest">Random Forest</option><option value="hist_gradient_boosting">Gradient Boosting</option><option value="logistic_regression">Logistic Regression</option></select><button onclick="train()">Train challenger</button><button onclick="refresh()">Refresh registry</button><div id="summary" class="cards"></div></section><section><h2>Monitoring simulator</h2><button onclick="simulate('healthy')">Healthy</button><button onclick="simulate('data_drift')">Data drift</button><button onclick="simulate('quality_drift')">Quality drift</button><button onclick="simulate('concept_drift')">Concept drift</button><button onclick="recover('data_drift')">Auto-recover drift</button></section><section><h2>System output</h2><pre id="out">Train an initial model, then deploy it from the registry. The dashboard will never auto-deploy an unvalidated model.</pre></section><section><h2>Model registry</h2><div id="models"></div></section><script>const out=x=>document.querySelector('#out').textContent=JSON.stringify(x,null,2);async function api(u,o){let r=await fetch(u,o);let x=await r.json();if(!r.ok)throw x;return x}async function train(){try{out(await api('/models/train',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({algorithm:algo.value})}));refresh()}catch(e){out(e)}}async function simulate(s){try{out(await api('/monitoring/simulate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({scenario:s})}))}catch(e){out(e)}}async function recover(s){try{out(await api('/recovery/start',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({scenario:s})}));refresh()}catch(e){out(e)}}async function deploy(id){try{out(await api('/models/'+id+'/deploy',{method:'POST'}));refresh()}catch(e){out(e)}}async function refresh(){let h=await api('/monitoring/health');summary.innerHTML=`<div class="card">Champion<br><b>${h.champion?.version||'None'}</b></div><div class="card">Open incidents<br><b>${h.open_incidents}</b></div>`;let m=await api('/models');models.innerHTML=m.map(x=>`<div class="card"><b>${x.version}</b> · ${x.algorithm}<br>F1: ${x.metrics.f1} · Recall: ${x.metrics.recall}<br><span class="${x.status==='PRODUCTION'?'good':'warn'}">${x.status}</span>${x.status!=='PRODUCTION'?` <button onclick="deploy('${x.id}')">Deploy</button>`:''}</div>`).join('')}refresh()</script></body></html>
